<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .form-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #4ecdc4;
            font-weight: bold;
            font-size: 14px;
        }
        textarea, select {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            resize: vertical;
        }
        textarea {
            min-height: 80px;
        }
        textarea:focus, select:focus {
            outline: none;
            border-color: #4ecdc4;
        }
        select option {
            background: #1a1a2e;
            color: #fff;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-generate {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        .btn-generate:hover {
            transform: scale(1.02);
        }
        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #4ecdc4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .results-title {
            font-size: 18px;
            color: #4ecdc4;
            margin-bottom: 15px;
            display: none;
        }
        .results-title.active {
            display: block;
        }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .image-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s;
        }
        .image-card:hover {
            transform: translateY(-5px);
        }
        .image-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .image-info {
            padding: 15px;
        }
        .image-prompt {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .image-size {
            color: #4ecdc4;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-download, .btn-copy {
            flex: 1;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-download {
            background: #4ecdc4;
            color: #1a1a2e;
        }
        .btn-download:hover {
            background: #45b7aa;
        }
        .btn-copy {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .btn-copy:hover {
            background: rgba(255,255,255,0.2);
        }
        .error-message {
            background: rgba(255,107,107,0.1);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .error-message.active {
            display: block;
        }
        .history-title {
            font-size: 18px;
            color: #4ecdc4;
            margin-bottom: 15px;
        }
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .history-card {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .history-card:hover {
            transform: scale(1.05);
        }
        .history-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .history-info {
            padding: 10px;
            font-size: 11px;
            color: #aaa;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .clear-btn {
            display: inline-block;
            padding: 8px 15px;
            background: #ff6b6b;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .clear-btn:hover {
            background: #ff5252;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2ecc71;
            color: #fff;
            padding: 15px 20px;
            border-radius: 10px;
            font-weight: bold;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Image Generator</h1>
        <p class="subtitle">Generate anime and realistic images instantly</p>

        <div class="form-card">
            <form id="generateForm">
                <div class="form-group">
                    <label>Prompt</label>
                    <textarea id="prompt" placeholder="Contoh: Anime style, pantai tropis saat matahari terbenam" required></textarea>
                </div>

                <div class="form-group">
                    <label>Negative Prompt (Opsional)</label>
                    <textarea id="negativePrompt" placeholder="Contoh: blurry, low quality, ugly"></textarea>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Ukuran Gambar</label>
                        <select id="size">
                            <option value="1440x720">1440x720 (Landscape)</option>
                            <option value="720x1440">720x1440 (Portrait)</option>
                            <option value="1024x720">1024x720 (Landscape)</option>
                            <option value="720x1024">720x1024 (Portrait)</option>
                            <option value="1440x1440">1440x1440 (Square)</option>
                            <option value="1024x1024">1024x1024 (Square)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Jumlah Gambar</label>
                        <select id="jumlah">
                            <option value="1">1 Gambar</option>
                            <option value="2">2 Gambar</option>
                            <option value="3">3 Gambar</option>
                            <option value="4">4 Gambar</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-generate" id="btnGenerate">Generate Image</button>
            </form>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Generating image, please wait...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="results-title" id="resultsTitle">Hasil Generate</div>
        <div class="results" id="results"></div>

        <button class="clear-btn" onclick="clearHistory()">Clear History</button>
        <div class="history-title">Riwayat Generate</div>
        <div class="history-grid" id="historyGrid"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let history = [];

        if (localStorage.getItem('imageHistory')) {
            try {
                history = JSON.parse(localStorage.getItem('imageHistory'));
            } catch(e) {
                history = [];
            }
            renderHistory();
        }

        document.getElementById('generateForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const prompt = document.getElementById('prompt').value.trim();
            const negativePrompt = document.getElementById('negativePrompt').value.trim();
            const size = document.getElementById('size').value;
            const jumlah = parseInt(document.getElementById('jumlah').value);
            const btnGenerate = document.getElementById('btnGenerate');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const results = document.getElementById('results');
            const resultsTitle = document.getElementById('resultsTitle');

            errorMessage.classList.remove('active');
            errorMessage.textContent = '';
            results.innerHTML = '';
            resultsTitle.classList.remove('active');

            if (!prompt) {
                showError('Prompt tidak boleh kosong!');
                return;
            }

            loading.classList.add('active');
            btnGenerate.disabled = true;
            btnGenerate.textContent = 'Generating...';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        negativePrompt: negativePrompt,
                        size: size,
                        jumlah: jumlah
                    })
                });

                const data = await response.json();

                if (data.success && data.images && data.images.length > 0) {
                    resultsTitle.classList.add('active');
                    
                    data.images.forEach((img, index) => {
                        const card = document.createElement('div');
                        card.className = 'image-card';
                        card.innerHTML = `
                            <img src="${img.url}" alt="Generated Image ${index + 1}" loading="lazy">
                            <div class="image-info">
                                <div class="image-prompt">${escapeHtml(prompt)}</div>
                                <div class="image-size">Image ${index + 1} | ${size}</div>
                                <div class="btn-group">
                                    <button class="btn-download" onclick="downloadImage('${img.url}', 'image_${index + 1}_${Date.now()}.jpg')">Download</button>
                                    <button class="btn-copy" onclick="copyImageUrl('${img.url}')">Copy URL</button>
                                </div>
                            </div>
                        `;
                        results.appendChild(card);

                        history.unshift({
                            url: img.url,
                            prompt: prompt,
                            size: size,
                            timestamp: new Date().toISOString()
                        });
                    });

                    if (history.length > 50) {
                        history = history.slice(0, 50);
                    }
                    localStorage.setItem('imageHistory', JSON.stringify(history));
                    renderHistory();

                } else {
                    showError(data.message || 'Gagal generate gambar');
                }

            } catch (error) {
                showError('Network error, silakan coba lagi');
            } finally {
                loading.classList.remove('active');
                btnGenerate.disabled = false;
                btnGenerate.textContent = 'Generate Image';
            }
        });

        async function downloadImage(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
                showToast('Download dimulai!');
            } catch (error) {
                window.open(url, '_blank');
                showToast('Membuka di tab baru...');
            }
        }

        async function copyImageUrl(url) {
            try {
                await navigator.clipboard.writeText(url);
                showToast('URL berhasil dicopy!');
            } catch (error) {
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('URL berhasil dicopy!');
            }
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            setTimeout(() => {
                errorMessage.classList.remove('active');
            }, 5000);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearHistory() {
            if (confirm('Hapus semua riwayat?')) {
                history = [];
                localStorage.removeItem('imageHistory');
                renderHistory();
            }
        }

        function renderHistory() {
            const historyGrid = document.getElementById('historyGrid');
            historyGrid.innerHTML = '';

            if (history.length === 0) {
                historyGrid.innerHTML = '<p style="color:#888;grid-column:1/-1;">Belum ada riwayat</p>';
                return;
            }

            history.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'history-card';
                card.onclick = function() {
                    window.open(item.url, '_blank');
                };
                card.innerHTML = `
                    <img src="${item.url}" alt="History ${index + 1}" loading="lazy">
                    <div class="history-info">${escapeHtml(item.prompt)}</div>
                `;
                historyGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
