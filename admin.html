<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - AI Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .header h1 {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-name {
            color: #4ecdc4;
            font-weight: bold;
        }
        .btn-logout {
            padding: 8px 15px;
            background: #ff6b6b;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-logout:hover {
            background: #ff5252;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #4ecdc4;
        }
        .panel-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .panel-title {
            font-size: 18px;
            color: #4ecdc4;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4ecdc4;
        }
        select option {
            background: #1a1a2e;
            color: #fff;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background: #4ecdc4;
            color: #1a1a2e;
        }
        .btn-danger {
            background: #ff6b6b;
        }
        .btn-success {
            background: #2ecc71;
            color: #1a1a2e;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
        }
        .user-table th {
            text-align: left;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            color: #4ecdc4;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .user-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-admin {
            background: #ff6b6b;
            color: #fff;
        }
        .badge-user {
            background: #4ecdc4;
            color: #1a1a2e;
        }
        .log-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .log-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
            color: #aaa;
        }
        .log-time {
            color: #4ecdc4;
            margin-right: 10px;
        }
        .message {
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
        .message.active {
            display: block;
        }
        .message-success {
            background: rgba(46,204,113,0.1);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }
        .message-error {
            background: rgba(255,107,107,0.1);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Admin Panel</h1>
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Generate Hari Ini</div>
                <div class="stat-value" id="totalGenerate">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Users</div>
                <div class="stat-value" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Sisa Koin</div>
                <div class="stat-value" id="sisaKoin">590</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Session Active</div>
                <div class="stat-value">1</div>
            </div>
        </div>

        <!-- User Management -->
        <div class="panel-card">
            <div class="panel-title">Manajemen User</div>
            
            <div style="display:flex;gap:10px;margin-bottom:20px;">
                <input type="text" id="newUsername" placeholder="Username baru" style="flex:1;">
                <input type="password" id="newPassword" placeholder="Password" style="flex:1;">
                <select id="newRole" style="width:150px;">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
                <button class="btn btn-primary" onclick="addUser()">Tambah User</button>
            </div>

            <div class="message message-success" id="successMessage"></div>
            <div class="message message-error" id="errorMessage"></div>

            <table class="user-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="userList"></tbody>
            </table>
        </div>

        <!-- Activity Log -->
        <div class="panel-card">
            <div class="panel-title">Log Aktivitas</div>
            <div class="log-list" id="logList">
                <div class="log-item"><span class="log-time">--:--</span> Menunggu aktivitas...</div>
            </div>
        </div>
    </div>

    <script>
        // Cek login admin
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        const userData = JSON.parse(localStorage.getItem('userData'));
        if (!userData || userData.role !== 'admin') {
            window.location.href = 'index.html';
        }

        document.getElementById('userName').textContent = userData.name;

        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userData');
            window.location.href = 'login.html';
        }

        // User database
        let users = {
            'admin': { password: 'admin123', role: 'admin', name: 'Administrator' },
            'user': { password: 'user123', role: 'user', name: 'User Biasa' }
        };

        if (localStorage.getItem('usersDB')) {
            try {
                users = JSON.parse(localStorage.getItem('usersDB'));
            } catch(e) {}
        }

        // Activity log
        let logs = [];
        if (localStorage.getItem('activityLogs')) {
            try {
                logs = JSON.parse(localStorage.getItem('activityLogs'));
            } catch(e) {}
        }

        function addLog(message) {
            const now = new Date();
            const time = now.toLocaleTimeString('id-ID');
            logs.unshift({ time, message });
            if (logs.length > 100) logs = logs.slice(0, 100);
            localStorage.setItem('activityLogs', JSON.stringify(logs));
            renderLogs();
        }

        function renderLogs() {
            const logList = document.getElementById('logList');
            logList.innerHTML = logs.slice(0, 20).map(log => 
                `<div class="log-item"><span class="log-time">${log.time}</span>${log.message}</div>`
            ).join('') || '<div class="log-item">Tidak ada log</div>';
        }

        function renderUsers() {
            const userList = document.getElementById('userList');
            userList.innerHTML = Object.keys(users).map(username => `
                <tr>
                    <td>${username}</td>
                    <td><span class="badge badge-${users[username].role}">${users[username].role}</span></td>
                    <td>Active</td>
                    <td>
                        <button class="btn btn-danger" onclick="deleteUser('${username}')" ${username === 'admin' ? 'disabled' : ''}>Hapus</button>
                    </td>
                </tr>
            `).join('');

            document.getElementById('totalUsers').textContent = Object.keys(users).length;
        }

        window.addUser = function() {
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const role = document.getElementById('newRole').value;

            if (!username || !password) {
                document.getElementById('errorMessage').textContent = 'Username dan password harus diisi!';
                document.getElementById('errorMessage').classList.add('active');
                return;
            }

            if (users[username]) {
                document.getElementById('errorMessage').textContent = 'Username sudah ada!';
                document.getElementById('errorMessage').classList.add('active');
                return;
            }

            users[username] = { password, role, name: username };
            localStorage.setItem('usersDB', JSON.stringify(users));
            
            document.getElementById('newUsername').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('errorMessage').classList.remove('active');
            document.getElementById('successMessage').textContent = `User ${username} berhasil ditambahkan!`;
            document.getElementById('successMessage').classList.add('active');
            
            addLog(`User ${username} ditambahkan sebagai ${role}`);
            renderUsers();

            setTimeout(() => {
                document.getElementById('successMessage').classList.remove('active');
            }, 3000);
        };

        window.deleteUser = function(username) {
            if (username === 'admin') return;
            if (confirm(`Hapus user ${username}?`)) {
                delete users[username];
                localStorage.setItem('usersDB', JSON.stringify(users));
                addLog(`User ${username} dihapus`);
                renderUsers();
            }
        };

        // Update generate count
        const today = new Date().toDateString();
        let genCount = 0;
        if (localStorage.getItem('genCount')) {
            const data = JSON.parse(localStorage.getItem('genCount'));
            if (data.date === today) {
                genCount = data.count;
            }
        }
        document.getElementById('totalGenerate').textContent = genCount;

        renderUsers();
        renderLogs();
        addLog('Admin login');
    </script>
</body>
</html>
