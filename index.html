<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 20px;
        }
        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-badge {
            background: rgba(78,205,196,0.2);
            color: #4ecdc4;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn-primary {
            background: #4ecdc4;
            color: #1a1a2e;
        }
        .btn-danger {
            background: #ff6b6b;
        }
        .btn-warning {
            background: #f39c12;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .form-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #4ecdc4;
            font-weight: bold;
            font-size: 14px;
        }
        textarea, select, input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            resize: vertical;
        }
        textarea {
            min-height: 80px;
        }
        textarea:focus, select:focus, input:focus {
            outline: none;
            border-color: #4ecdc4;
        }
        select option {
            background: #1a1a2e;
            color: #fff;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-generate {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        .btn-generate:hover {
            transform: scale(1.02);
        }
        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #4ecdc4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .results-title {
            font-size: 18px;
            color: #4ecdc4;
            margin-bottom: 15px;
            display: none;
        }
        .results-title.active {
            display: block;
        }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .image-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }
        .image-card:hover {
            transform: translateY(-5px);
        }
        .image-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .image-info {
            padding: 15px;
        }
        .image-prompt {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-download, .btn-copy {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-download {
            background: #4ecdc4;
            color: #1a1a2e;
        }
        .btn-copy {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .error-message {
            background: rgba(255,107,107,0.1);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .error-message.active {
            display: block;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2ecc71;
            color: #fff;
            padding: 15px 20px;
            border-radius: 10px;
            font-weight: bold;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 10000;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
        }
        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: #ff6b6b;
            color: #fff;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        .modal-actions {
            position: absolute;
            bottom: -50px;
            left: 0;
            right: 0;
            display: flex;
            gap: 10px;
        }
        /* Auth Modal */
        .auth-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9998;
            align-items: center;
            justify-content: center;
        }
        .auth-modal.active {
            display: flex;
        }
        .auth-card {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .auth-title {
            font-size: 1.5em;
            color: #4ecdc4;
            margin-bottom: 20px;
            text-align: center;
        }
        .password-group {
            position: relative;
        }
        .toggle-pw {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #4ecdc4;
            cursor: pointer;
            font-size: 20px;
        }
        .auth-link {
            text-align: center;
            margin-top: 15px;
            color: #888;
        }
        .auth-link a {
            color: #4ecdc4;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div></div>
        <div class="user-section" id="userSection">
            <button class="btn btn-primary" onclick="showAuthModal('login')">Login</button>
        </div>
    </div>

    <div class="container">
        <h1>AI Image Generator</h1>
        <p class="subtitle">Generate anime and realistic images instantly</p>

        <div class="form-card">
            <form id="generateForm">
                <div class="form-group">
                    <label>Prompt</label>
                    <textarea id="prompt" placeholder="Contoh: Anime style, pantai tropis saat matahari terbenam" required></textarea>
                </div>

                <div class="form-group">
                    <label>Negative Prompt (Opsional)</label>
                    <textarea id="negativePrompt" placeholder="Contoh: blurry, low quality, ugly"></textarea>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Ukuran Gambar</label>
                        <select id="size">
                            <option value="1440x720">1440x720 (Landscape)</option>
                            <option value="720x1440">720x1440 (Portrait)</option>
                            <option value="1024x720">1024x720 (Landscape)</option>
                            <option value="720x1024">720x1024 (Portrait)</option>
                            <option value="1440x1440">1440x1440 (Square)</option>
                            <option value="1024x1024">1024x1024 (Square)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Jumlah Gambar</label>
                        <select id="jumlah">
                            <option value="1">1 Gambar</option>
                            <option value="2">2 Gambar</option>
                            <option value="3">3 Gambar</option>
                            <option value="4">4 Gambar</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-generate" id="btnGenerate">Generate Image</button>
            </form>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Generating image, please wait...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="results-title" id="resultsTitle">Hasil Generate</div>
        <div class="results" id="results"></div>
    </div>

    <!-- Image Preview Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">X</button>
            <img id="modalImage" src="" alt="Preview">
            <div class="modal-actions">
                <button class="btn btn-primary" id="modalDownload">Download</button>
                <button class="btn btn-warning" id="modalCopy">Copy URL</button>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="auth-modal" id="authModal">
        <div class="auth-card">
            <div class="auth-title" id="authTitle">Login</div>
            <form id="authForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="authUsername" placeholder="Username" required>
                </div>
                <div class="form-group password-group">
                    <label>Password</label>
                    <input type="password" id="authPassword" placeholder="Password" required>
                    <button type="button" class="toggle-pw" onclick="togglePassword()">O</button>
                </div>
                <div class="form-group" id="confirmGroup" style="display:none;">
                    <label>Confirm Password</label>
                    <input type="password" id="authConfirm" placeholder="Confirm password">
                </div>
                <button type="submit" class="btn-generate">Submit</button>
            </form>
            <div class="auth-link">
                <span id="authSwitchText">Belum punya akun?</span>
                <a id="authSwitchLink" onclick="switchAuth()">Register</a>
            </div>
            <div class="error-message" id="authError"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Cookie management
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function deleteCookie(name) {
            document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/`;
        }

        // User DB
        let usersDB = {};
        if (localStorage.getItem('usersDB')) {
            try { usersDB = JSON.parse(localStorage.getItem('usersDB')); } catch(e) {}
        }

        // Image results DB
        let resultsDB = {};
        if (localStorage.getItem('resultsDB')) {
            try { resultsDB = JSON.parse(localStorage.getItem('resultsDB')); } catch(e) {}
        }

        let currentUser = getCookie('ai_user');
        let currentImageUrl = '';

        // Init
        if (currentUser) {
            showLoggedIn(currentUser);
        }

        function showLoggedIn(username) {
            document.getElementById('userSection').innerHTML = `
                <span class="user-badge">@${username}</span>
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            `;
        }

        function logout() {
            deleteCookie('ai_user');
            currentUser = null;
            document.getElementById('userSection').innerHTML = `
                <button class="btn btn-primary" onclick="showAuthModal('login')">Login</button>
            `;
            showToast('Logged out');
        }

        function showAuthModal(type) {
            document.getElementById('authModal').classList.add('active');
            document.getElementById('authError').classList.remove('active');
            
            if (type === 'login') {
                document.getElementById('authTitle').textContent = 'Login';
                document.getElementById('confirmGroup').style.display = 'none';
                document.getElementById('authSwitchText').textContent = 'Belum punya akun? ';
                document.getElementById('authSwitchLink').textContent = 'Register';
                document.getElementById('authForm').dataset.type = 'login';
            } else {
                document.getElementById('authTitle').textContent = 'Register';
                document.getElementById('confirmGroup').style.display = 'block';
                document.getElementById('authSwitchText').textContent = 'Sudah punya akun? ';
                document.getElementById('authSwitchLink').textContent = 'Login';
                document.getElementById('authForm').dataset.type = 'register';
            }
        }

        function switchAuth() {
            const currentType = document.getElementById('authForm').dataset.type;
            showAuthModal(currentType === 'login' ? 'register' : 'login');
        }

        function togglePassword() {
            const pwInput = document.getElementById('authPassword');
            const confirmInput = document.getElementById('authConfirm');
            const btn = document.querySelector('.toggle-pw');
            
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                if (confirmInput) confirmInput.type = 'text';
                btn.textContent = '-';
            } else {
                pwInput.type = 'password';
                if (confirmInput) confirmInput.type = 'password';
                btn.textContent = 'O';
            }
        }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const type = this.dataset.type;
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const confirm = document.getElementById('authConfirm').value.trim();
            const authError = document.getElementById('authError');

            authError.classList.remove('active');

            if (!username || !password) {
                authError.textContent = 'Semua field harus diisi!';
                authError.classList.add('active');
                return;
            }

            if (type === 'register') {
                if (password !== confirm) {
                    authError.textContent = 'Password tidak cocok!';
                    authError.classList.add('active');
                    return;
                }
                if (usersDB[username]) {
                    authError.textContent = 'Username sudah terdaftar!';
                    authError.classList.add('active');
                    return;
                }
                
                usersDB[username] = { password, created: new Date().toISOString() };
                localStorage.setItem('usersDB', JSON.stringify(usersDB));
                
                setCookie('ai_user', username);
                currentUser = username;
                showLoggedIn(username);
                document.getElementById('authModal').classList.remove('active');
                showToast('Registrasi berhasil!');
            } else {
                if (!usersDB[username] || usersDB[username].password !== password) {
                    authError.textContent = 'Username atau password salah!';
                    authError.classList.add('active');
                    return;
                }
                
                setCookie('ai_user', username);
                currentUser = username;
                showLoggedIn(username);
                document.getElementById('authModal').classList.remove('active');
                showToast('Login berhasil!');
            }
        });

        // Close auth modal on click outside
        document.getElementById('authModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
            }
        });

        // Generate form
        document.getElementById('generateForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!currentUser) {
                showToast('Silakan login terlebih dahulu!');
                showAuthModal('login');
                return;
            }

            const prompt = document.getElementById('prompt').value.trim();
            const negativePrompt = document.getElementById('negativePrompt').value.trim();
            const size = document.getElementById('size').value;
            const jumlah = parseInt(document.getElementById('jumlah').value);
            const btnGenerate = document.getElementById('btnGenerate');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const results = document.getElementById('results');
            const resultsTitle = document.getElementById('resultsTitle');

            errorMessage.classList.remove('active');
            errorMessage.textContent = '';
            results.innerHTML = '';
            resultsTitle.classList.remove('active');

            if (!prompt) {
                showError('Prompt tidak boleh kosong!');
                return;
            }

            loading.classList.add('active');
            btnGenerate.disabled = true;
            btnGenerate.textContent = 'Generating...';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt, negativePrompt, size, jumlah,
                        username: currentUser
                    })
                });

                const data = await response.json();

                if (data.success && data.images && data.images.length > 0) {
                    resultsTitle.classList.add('active');
                    
                    // Save to resultsDB
                    if (!resultsDB[currentUser]) {
                        resultsDB[currentUser] = [];
                    }

                    data.images.forEach((img, index) => {
                        const card = document.createElement('div');
                        card.className = 'image-card';
                        card.innerHTML = `
                            <img src="${img.url}" alt="Generated Image ${index + 1}" loading="lazy" onclick="openPreview('${img.url}')">
                            <div class="image-info">
                                <div class="image-prompt">${escapeHtml(prompt)}</div>
                                <div class="btn-group">
                                    <button class="btn-download" onclick="event.stopPropagation();downloadImage('${img.url}', 'image_${Date.now()}.jpg')">Download</button>
                                    <button class="btn-copy" onclick="event.stopPropagation();copyUrl('${img.url}')">Copy URL</button>
                                </div>
                            </div>
                        `;
                        results.appendChild(card);

                        resultsDB[currentUser].unshift({
                            url: img.url,
                            prompt: prompt,
                            size: size,
                            timestamp: new Date().toISOString()
                        });
                    });

                    if (resultsDB[currentUser].length > 50) {
                        resultsDB[currentUser] = resultsDB[currentUser].slice(0, 50);
                    }
                    localStorage.setItem('resultsDB', JSON.stringify(resultsDB));

                } else {
                    showError(data.message || 'Gagal generate gambar');
                }

            } catch (error) {
                showError('Network error, silakan coba lagi');
            } finally {
                loading.classList.remove('active');
                btnGenerate.disabled = false;
                btnGenerate.textContent = 'Generate Image';
            }
        });

        function openPreview(url) {
            currentImageUrl = url;
            document.getElementById('modalImage').src = url;
            document.getElementById('imageModal').classList.add('active');
            
            document.getElementById('modalDownload').onclick = function() {
                downloadImage(url, `image_${Date.now()}.jpg`);
            };
            
            document.getElementById('modalCopy').onclick = function() {
                copyUrl(url);
            };
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        async function downloadImage(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
                showToast('Download dimulai!');
            } catch (error) {
                window.open(url, '_blank');
            }
        }

        async function copyUrl(url) {
            try {
                await navigator.clipboard.writeText(url);
                showToast('URL berhasil dicopy!');
            } catch (error) {
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('URL berhasil dicopy!');
            }
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            setTimeout(() => {
                errorMessage.classList.remove('active');
            }, 5000);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
