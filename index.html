<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image /title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .user-section { display: flex; align-items: center; gap: 10px; }
        .user-badge {
            background: rgba(78,205,196,0.2);
            color: #4ecdc4;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: transform 0.2s;
            white-space: nowrap;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-primary { background: #4ecdc4; color: #1a1a2e; }
        .btn-danger { background: #ff6b6b; }
        
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2.2em;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 14px; }
        
        .form-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 25px;
        }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #4ecdc4; font-weight: bold; font-size: 13px; }
        textarea, input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            resize: vertical;
            line-height: 1.5;
        }
        textarea { min-height: 70px; }
        textarea:focus, input:focus { outline: none; border-color: #4ecdc4; }
        
        .preset-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .preset-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            color: #ccc;
            font-weight: bold;
            white-space: nowrap;
        }
        .preset-item:hover { border-color: #4ecdc4; background: rgba(78,205,196,0.1); }
        .preset-item.active { border-color: #4ecdc4; background: rgba(78,205,196,0.2); color: #4ecdc4; }
        
        .option-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .option-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
            color: #ccc;
            font-weight: bold;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .option-item:hover { border-color: #4ecdc4; background: rgba(78,205,196,0.1); }
        .option-item.active { border-color: #4ecdc4; background: rgba(78,205,196,0.2); color: #4ecdc4; }
        .size-icon { width: 28px; height: 20px; border: 2px solid currentColor; border-radius: 3px; display: inline-block; }
        .size-icon.landscape { width: 28px; height: 18px; }
        .size-icon.portrait { width: 18px; height: 28px; }
        .size-icon.square { width: 22px; height: 22px; }
        
        .btn-generate {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 5px;
        }
        .btn-generate:hover { transform: scale(1.02); }
        .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .loading { display: none; text-align: center; padding: 20px; }
        .loading.active { display: block; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #4ecdc4;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .result-container { display: flex; justify-content: center; margin-bottom: 10px; }
        .result-wrapper { position: relative; display: inline-block; }
        .result-image {
            max-width: 100%;
            max-height: 500px;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .result-image:hover { transform: scale(1.02); }
        .result-user {
            position: absolute;
            bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.7);
            color: #4ecdc4;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .error-message {
            background: rgba(255,107,107,0.1);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        .error-message.active { display: block; }
        
        .toast {
            position: fixed;
            bottom: 20px; right: 20px;
            background: #2ecc71;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 10000;
            font-size: 13px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { background: #ff6b6b; }

        .saran-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .saran-icon svg { width: 24px; height: 24px; stroke: #4ecdc4; }
        .saran-input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 13px;
        }
        .saran-input:focus { outline: none; border-color: #4ecdc4; }
        .btn-saran {
            padding: 10px 20px;
            background: #4ecdc4;
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }
        .btn-saran:hover { transform: scale(1.05); }

        .gallery-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .gallery-tab {
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .gallery-tab.active { background: #4ecdc4; color: #1a1a2e; border-color: #4ecdc4; }
        .history-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .history-scroll::-webkit-scrollbar { height: 4px; }
        .history-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .history-card {
            min-width: 200px; max-width: 200px;
            flex-shrink: 0;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.2s;
        }
        .history-card:hover { transform: scale(1.03); }
        .history-card img { width: 100%; height: 150px; object-fit: cover; cursor: pointer; }
        .history-card .card-info { padding: 10px; }
        .history-card .card-user { font-size: 10px; color: #4ecdc4; font-weight: bold; margin-bottom: 4px; }
        .history-card .card-prompt { font-size: 10px; color: #888; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
        .history-card .card-actions { display: flex; gap: 5px; flex-wrap: wrap; }
        .btn-sm { padding: 4px 8px; border: none; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; }
        .btn-sm-copy { background: #4ecdc4; color: #1a1a2e; }
        .btn-sm-dl { background: rgba(255,255,255,0.2); color: #fff; }
        .btn-sm-pub { background: #f39c12; color: #fff; }
        .btn-sm-del { background: #ff6b6b; color: #fff; }

        .preview-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .preview-modal.active { display: flex; }
        .preview-modal img { max-width: 95%; max-height: 95vh; border-radius: 10px; object-fit: contain; }
        .auth-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9998;
            align-items: center;
            justify-content: center;
        }
        .auth-modal.active { display: flex; }
        .auth-card {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .auth-title { font-size: 1.3em; color: #4ecdc4; margin-bottom: 20px; text-align: center; }
        .auth-input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .auth-input:focus { outline: none; border-color: #4ecdc4; }
        .password-wrapper { position: relative; margin-bottom: 15px; }
        .password-wrapper .auth-input { margin-bottom: 0; padding-right: 45px; }
        .toggle-pw {
            position: absolute;
            right: 0; top: 0;
            height: 100%; width: 45px;
            background: none;
            border: none;
            color: #4ecdc4;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .toggle-pw:hover { color: #fff; }
        .auth-link { text-align: center; margin-top: 15px; color: #888; font-size: 13px; }
        .auth-link a { color: #4ecdc4; cursor: pointer; text-decoration: none; font-weight: bold; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 1.6em; }
            .form-card { padding: 15px; border-radius: 15px; }
            textarea { font-size: 16px; min-height: 60px; }
            .preset-item { padding: 6px 12px; font-size: 11px; }
            .option-item { padding: 10px 12px; font-size: 10px; }
            .btn-generate { padding: 16px; font-size: 16px; }
            .header { flex-direction: column; text-align: center; }
            .saran-card { flex-direction: column; align-items: stretch; }
            .history-card { min-width: 160px; max-width: 160px; }
            .history-card img { height: 120px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div></div>
        <div class="user-section" id="userSection">
            <button class="btn btn-primary" onclick="showAuthModal('login')">Login</button>
        </div>
    </div>

    <div class="container">
        <h1>AI Image Generator</h1>
        <p class="subtitle">Generate stunning anime and realistic images</p>

        <div class="form-card">
            <form id="generateForm">
                <div class="form-group">
                    <label>Preset</label>
                    <div class="preset-list" id="presetList">
                        <div class="preset-item active" data-prompt="masterpiece, best quality, cinematic lighting, anime art style, hand-drawn aesthetic, modern Japanese anime movie visual, highly detailed background, photorealistic clouds and sky, beautiful architecture, soft natural lighting, lens flare, depth of field, 8k" data-negative="3d render, cgi, cartoon, flat, simple, ugly, deformed, blurry, low quality">Cinematic Anime</div>
                        <div class="preset-item" data-prompt="masterpiece, best quality, cinematic, anime art style, girl sitting by crystal clear river, flowing water, detailed rocks, sun rays through trees, photorealistic nature background, hand-drawn anime character, soft lighting, dappled light, 8k" data-negative="3d render, cgi, cartoon, flat, simple, ugly, deformed, blurry, low quality">River Scene</div>
                        <div class="preset-item" data-prompt="masterpiece, best quality, ultra realistic, photorealistic landscape, vast green meadow, dramatic cumulus clouds, golden hour sunlight, distant mountains, wildflowers, 8k, highly detailed nature" data-negative="blurry, low quality, painting, cartoon, anime, ugly, deformed">Ultra Realistic</div>
                        <div class="preset-item" data-prompt="masterpiece, best quality, cinematic, anime art style, couple walking under autumn trees, falling leaves, warm golden light, detailed city park, photorealistic environment, hand-drawn characters, emotional atmosphere, 8k" data-negative="3d render, cgi, cartoon, flat, simple, ugly, deformed, blurry, low quality">Autumn Couple</div>
                        <div class="preset-item" data-prompt="masterpiece, best quality, cinematic, anime art style, train station platform, dramatic sky with sunset clouds, power lines, detailed urban landscape, hand-drawn aesthetic, warm and cool color contrast, 8k" data-negative="3d render, cgi, cartoon, flat, simple, ugly, deformed, blurry, low quality">Urban Sunset</div>
                        <div class="preset-item" data-prompt="masterpiece, best quality, cinematic, anime art style, girl standing on hilltop overlooking city at night, starry sky, city lights below, wind blowing hair, emotional, hand-drawn, 8k" data-negative="3d render, cgi, cartoon, flat, simple, ugly, deformed, blurry, low quality">Night City View</div>
                        <div class="preset-item" data-prompt="masterpiece, best quality, ultra realistic, tropical beach, crystal clear water, white sand, palm trees, sunset with orange purple sky, photorealistic, 8k" data-negative="blurry, low quality, cartoon, painting, anime, ugly, deformed">Tropical Beach</div>
                        <div class="preset-item" data-prompt="masterpiece, best quality, anime art style, classroom with sunlight streaming through windows, cherry blossoms outside, peaceful atmosphere, detailed school interior, hand-drawn, 8k" data-negative="3d render, cgi, cartoon, flat, simple, ugly, deformed, blurry, low quality">Classroom Spring</div>
                        <div class="preset-item" data-prompt="masterpiece, best quality, ultra realistic, mountain landscape, snow capped peaks, alpine lake reflection, pine trees, dramatic clouds, golden hour, photorealistic, 8k" data-negative="blurry, low quality, painting, cartoon, anime, ugly, deformed">Mountain Lake</div>
                        <div class="preset-item" data-prompt="masterpiece, best quality, anime art style, rainy city street at night, neon reflections on wet pavement, person with umbrella, cinematic mood, hand-drawn aesthetic, highly detailed, 8k" data-negative="3d render, cgi, cartoon, flat, simple, ugly, deformed, blurry, low quality">Rainy Neon Street</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Prompt</label>
                    <textarea id="prompt" placeholder="Describe the image you want to create..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Negative Prompt</label>
                    <input type="text" id="negativePrompt" placeholder="Optional: elements to exclude">
                </div>

                <div class="form-group">
                    <label>Size</label>
                    <div class="option-list" id="sizeList">
                        <div class="option-item active" data-value="1440x720"><span class="size-icon landscape"></span> 1440x720</div>
                        <div class="option-item" data-value="720x1440"><span class="size-icon portrait"></span> 720x1440</div>
                        <div class="option-item" data-value="1024x720"><span class="size-icon landscape"></span> 1024x720</div>
                        <div class="option-item" data-value="720x1024"><span class="size-icon portrait"></span> 720x1024</div>
                        <div class="option-item" data-value="1024x1024"><span class="size-icon square"></span> 1024x1024</div>
                        <div class="option-item" data-value="1440x1440"><span class="size-icon square"></span> 1440x1440</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Style</label>
                    <div class="option-list" id="styleList">
                        <div class="option-item active" data-value="">Default</div>
                        <div class="option-item" data-value="cinematic">Cinematic</div>
                        <div class="option-item" data-value="anime">Anime Art</div>
                        <div class="option-item" data-value="realistic">Realistic</div>
                        <div class="option-item" data-value="ghibli">Ghibli</div>
                        <div class="option-item" data-value="fantasy">Fantasy</div>
                        <div class="option-item" data-value="noir">Noir</div>
                        <div class="option-item" data-value="vintage">Vintage</div>
                    </div>
                </div>

                <button type="submit" class="btn-generate" id="btnGenerate">Generate Image</button>
            </form>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Generating image...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="result-container" id="resultContainer"></div>

        <!-- Saran Box -->
        <div class="saran-card">
            <div class="saran-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
            </div>
            <input type="text" class="saran-input" id="saranInput" placeholder="Ada saran atau request? Tulis di sini...">
            <button class="btn-saran" onclick="kirimSaran()">Kirim</button>
        </div>

        <div class="gallery-tabs" id="galleryTabs" style="display:none;">
            <button class="gallery-tab active" onclick="switchGallery('mine')">My Gallery</button>
            <button class="gallery-tab" onclick="switchGallery('public')">Public Gallery</button>
        </div>
        <div class="history-scroll" id="historyScroll"></div>
    </div>

    <div class="preview-modal" id="previewModal"><img id="previewImage" src="" alt="Preview"></div>

    <div class="auth-modal" id="authModal">
        <div class="auth-card">
            <div class="auth-title" id="authTitle">Login</div>
            <form id="authForm">
                <input type="text" class="auth-input" id="authUsername" placeholder="Username" required>
                <div class="password-wrapper">
                    <input type="password" class="auth-input" id="authPassword" placeholder="Password" required>
                    <button type="button" class="toggle-pw" onclick="togglePassword()" tabindex="-1">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <div class="password-wrapper" id="confirmGroup" style="display:none;">
                    <input type="password" class="auth-input" id="authConfirm" placeholder="Confirm password">
                </div>
                <button type="submit" class="btn-generate" style="margin-top:10px;">Submit</button>
            </form>
            <div class="auth-link">
                <span id="authSwitchText">Don't have an account?</span>
                <a id="authSwitchLink" onclick="switchAuth()">Register</a>
            </div>
            <div class="error-message" id="authError"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function setCookie(n, v, d = 365) { const dt = new Date(); dt.setTime(dt.getTime() + (d * 24 * 60 * 60 * 1000)); document.cookie = `${n}=${v};expires=${dt.toUTCString()};path=/`; }
        function getCookie(n) { const v = `; ${document.cookie}`; const p = v.split(`; ${n}=`); if (p.length === 2) return p.pop().split(';').shift(); return null; }
        function deleteCookie(n) { document.cookie = `${n}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/`; }
        function getDB(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch(e) { return {}; } }
        function setDB(k, d) { localStorage.setItem(k, JSON.stringify(d)); }

        let usersDB = getDB('usersDB');
        let resultsDB = getDB('resultsDB');
        let publicDB = getDB('publicDB');
        let saranDB = getDB('saranDB');
        if (!Array.isArray(saranDB)) saranDB = [];
        let currentUser = getCookie('ai_user');
        let currentGallery = 'mine';
        let selectedSize = '1440x720';
        let selectedStyle = '';

        if (currentUser) { showLoggedIn(currentUser); document.getElementById('galleryTabs').style.display = 'flex'; renderGallery(); } else { renderPublicGallery(); }

        document.querySelectorAll('.preset-item').forEach(item => { item.addEventListener('click', function() { document.querySelectorAll('.preset-item').forEach(i => i.classList.remove('active')); this.classList.add('active'); document.getElementById('prompt').value = this.dataset.prompt; document.getElementById('negativePrompt').value = this.dataset.negative || ''; }); });
        document.querySelectorAll('#sizeList .option-item').forEach(item => { item.addEventListener('click', function() { document.querySelectorAll('#sizeList .option-item').forEach(i => i.classList.remove('active')); this.classList.add('active'); selectedSize = this.dataset.value; }); });
        document.querySelectorAll('#styleList .option-item').forEach(item => { item.addEventListener('click', function() { document.querySelectorAll('#styleList .option-item').forEach(i => i.classList.remove('active')); this.classList.add('active'); selectedStyle = this.dataset.value; }); });

        function showLoggedIn(u) { document.getElementById('userSection').innerHTML = `<span class="user-badge">@${u}</span><button class="btn btn-danger" onclick="logout()">Logout</button>`; }
        function logout() { deleteCookie('ai_user'); currentUser = null; document.getElementById('userSection').innerHTML = '<button class="btn btn-primary" onclick="showAuthModal(\'login\')">Login</button>'; document.getElementById('galleryTabs').style.display = 'none'; renderPublicGallery(); showToast('Logged out'); }
        function showAuthModal(type) { document.getElementById('authModal').classList.add('active'); document.getElementById('authError').classList.remove('active'); document.getElementById('authError').style.display = 'none'; document.getElementById('authForm').reset(); if (type === 'login') { document.getElementById('authTitle').textContent = 'Login'; document.getElementById('confirmGroup').style.display = 'none'; document.getElementById('authSwitchText').textContent = "Don't have an account? "; document.getElementById('authSwitchLink').textContent = 'Register'; document.getElementById('authForm').dataset.type = 'login'; } else { document.getElementById('authTitle').textContent = 'Register'; document.getElementById('confirmGroup').style.display = 'block'; document.getElementById('authSwitchText').textContent = 'Already have an account? '; document.getElementById('authSwitchLink').textContent = 'Login'; document.getElementById('authForm').dataset.type = 'register'; } }
        function switchAuth() { const t = document.getElementById('authForm').dataset.type; showAuthModal(t === 'login' ? 'register' : 'login'); }
        function togglePassword() { const pw = document.getElementById('authPassword'); const cf = document.getElementById('authConfirm'); pw.type = pw.type === 'password' ? 'text' : 'password'; if (cf) cf.type = cf.type === 'password' ? 'text' : 'password'; }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault(); const type = this.dataset.type; const u = document.getElementById('authUsername').value.trim(); const p = document.getElementById('authPassword').value.trim(); const c = document.getElementById('authConfirm').value.trim(); const ae = document.getElementById('authError'); ae.classList.remove('active'); ae.style.display = 'none';
            if (!u || !p) return showAuthError('All fields required!'); if (u.length < 3) return showAuthError('Username min 3 chars!'); if (p.length < 4) return showAuthError('Password min 4 chars!');
            usersDB = getDB('usersDB');
            if (type === 'register') { if (p !== c) return showAuthError('Passwords do not match!'); if (usersDB[u]) return showAuthError('Username already exists!'); usersDB[u] = { password: p, created: new Date().toISOString() }; setDB('usersDB', usersDB); setCookie('ai_user', u); currentUser = u; finishAuth('Registered successfully!'); }
            else { if (!usersDB[u] || usersDB[u].password !== p) return showAuthError('Wrong username or password!'); setCookie('ai_user', u); currentUser = u; finishAuth('Logged in!'); }
        });
        function finishAuth(msg) { showLoggedIn(currentUser); document.getElementById('authModal').classList.remove('active'); document.getElementById('galleryTabs').style.display = 'flex'; currentGallery = 'mine'; document.querySelectorAll('.gallery-tab').forEach((t, i) => t.classList.toggle('active', i === 0)); renderGallery(); showToast(msg); }
        function showAuthError(msg) { const ae = document.getElementById('authError'); ae.textContent = msg; ae.classList.add('active'); ae.style.display = 'block'; }
        document.getElementById('authModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });

        function kirimSaran() {
            const pesan = document.getElementById('saranInput').value.trim();
            if (!pesan) return showToast('Tulis saran dulu!', true);
            saranDB = getDB('saranDB'); if (!Array.isArray(saranDB)) saranDB = [];
            saranDB.push({ nama: currentUser || 'Anonim', pesan, timestamp: new Date().toISOString() });
            setDB('saranDB', saranDB);
            document.getElementById('saranInput').value = '';
            showToast('Saran terkirim!');
        }

        document.getElementById('generateForm').addEventListener('submit', async function(e) {
            e.preventDefault(); if (!currentUser) { showToast('Please login first!', true); showAuthModal('login'); return; }
            const prompt = document.getElementById('prompt').value.trim(); const negativePrompt = document.getElementById('negativePrompt').value.trim(); const btnGenerate = document.getElementById('btnGenerate'); const loading = document.getElementById('loading'); const errorMessage = document.getElementById('errorMessage'); const resultContainer = document.getElementById('resultContainer');
            errorMessage.classList.remove('active'); resultContainer.innerHTML = '';
            if (!prompt) { showError('Prompt cannot be empty!'); return; }
            const stylePrefixes = { cinematic: 'masterpiece, best quality, cinematic lighting, anime art style, hand-drawn aesthetic, highly detailed, 8k, ', anime: 'masterpiece, best quality, anime art style, hand-drawn, vibrant colors, highly detailed, 8k, ', realistic: 'masterpiece, best quality, ultra realistic, photorealistic, highly detailed, 8k, ', ghibli: 'masterpiece, best quality, Studio Ghibli art style, hand-drawn animation, soft pastel colors, dreamy atmosphere, 8k, ', fantasy: 'masterpiece, best quality, fantasy art, magical atmosphere, detailed, ethereal lighting, 8k, ', noir: 'masterpiece, best quality, film noir style, high contrast, dramatic shadows, moody atmosphere, black and white, 8k, ', vintage: 'masterpiece, best quality, vintage aesthetic, retro color palette, film grain, nostalgic atmosphere, 8k, ', '': '' };
            const finalPrompt = (stylePrefixes[selectedStyle] || '') + prompt;
            loading.classList.add('active'); btnGenerate.disabled = true; btnGenerate.textContent = 'Generating...';
            try {
                const response = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: finalPrompt, negativePrompt, size: selectedSize, jumlah: 1, username: currentUser }) });
                const data = await response.json();
                if (data.success && data.images && data.images.length > 0) { const img = data.images[0]; resultContainer.innerHTML = `<div class="result-wrapper"><img src="${img.url}" alt="Generated" class="result-image" onclick="openPreview('${img.url}')" loading="lazy"><span class="result-user">@${currentUser}</span></div>`; resultsDB = getDB('resultsDB'); if (!resultsDB[currentUser]) resultsDB[currentUser] = []; resultsDB[currentUser].unshift({ url: img.url, prompt: finalPrompt, size: selectedSize, timestamp: new Date().toISOString(), public: false }); if (resultsDB[currentUser].length > 50) resultsDB[currentUser] = resultsDB[currentUser].slice(0, 50); setDB('resultsDB', resultsDB); renderGallery(); showToast('Image generated!'); }
                else { showError(data.message || 'Failed to generate'); }
            } catch (error) { showError('Network error, please try again'); }
            finally { loading.classList.remove('active'); btnGenerate.disabled = false; btnGenerate.textContent = 'Generate Image'; }
        });

        function switchGallery(type) { currentGallery = type; document.querySelectorAll('.gallery-tab').forEach(t => t.classList.remove('active')); event.target.classList.add('active'); renderGallery(); }
        function renderGallery() { if (!currentUser) return renderPublicGallery(); resultsDB = getDB('resultsDB'); publicDB = getDB('publicDB'); const c = document.getElementById('historyScroll'); let items = currentGallery === 'mine' ? (resultsDB[currentUser] || []).map(r => ({ ...r, user: currentUser })) : Object.keys(publicDB).map(u => publicDB[u].map(r => ({ ...r, user: u }))).flat().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)); c.innerHTML = items.length === 0 ? '<p style="color:#888;padding:20px;">No images yet</p>' : items.map((r, i) => `<div class="history-card"><img src="${r.url}" alt="Image" onclick="openPreview('${r.url}')" loading="lazy"><div class="card-info"><div class="card-user">@${r.user}</div><div class="card-prompt">${escapeHtml(r.prompt || '')}</div><div class="card-actions"><button class="btn-sm btn-sm-copy" onclick="event.stopPropagation();copyText('${escapeHtml(r.prompt || '')}')">Copy</button><button class="btn-sm btn-sm-dl" onclick="event.stopPropagation();downloadImage('${r.url}')">DL</button>${currentGallery === 'mine' ? `<button class="btn-sm btn-sm-pub" onclick="event.stopPropagation();togglePublic('${currentUser}', ${i})">${r.public ? 'Unpub' : 'Pub'}</button><button class="btn-sm btn-sm-del" onclick="event.stopPropagation();deleteMyImage(${i})">X</button>` : ''}</div></div></div>`).join(''); }
        function renderPublicGallery() { publicDB = getDB('publicDB'); const c = document.getElementById('historyScroll'); let items = Object.keys(publicDB).map(u => publicDB[u].map(r => ({ ...r, user: u }))).flat().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)); c.innerHTML = items.length === 0 ? '<p style="color:#888;padding:20px;">No public images</p>' : items.map(r => `<div class="history-card"><img src="${r.url}" alt="Image" onclick="openPreview('${r.url}')" loading="lazy"><div class="card-info"><div class="card-user">@${r.user}</div><div class="card-prompt">${escapeHtml(r.prompt || '')}</div><div class="card-actions"><button class="btn-sm btn-sm-copy" onclick="event.stopPropagation();copyText('${escapeHtml(r.prompt || '')}')">Copy</button><button class="btn-sm btn-sm-dl" onclick="event.stopPropagation();downloadImage('${r.url}')">DL</button></div></div></div>`).join(''); }
        function togglePublic(user, idx) { resultsDB = getDB('resultsDB'); publicDB = getDB('publicDB'); const item = resultsDB[user][idx]; item.public = !item.public; resultsDB[user][idx] = item; setDB('resultsDB', resultsDB); if (item.public) { if (!publicDB[user]) publicDB[user] = []; publicDB[user].push(item); } else { if (publicDB[user]) publicDB[user] = publicDB[user].filter(p => p.url !== item.url); } setDB('publicDB', publicDB); renderGallery(); showToast(item.public ? 'Published!' : 'Unpublished'); }
        function deleteMyImage(idx) { if (!confirm('Delete this image?')) return; resultsDB = getDB('resultsDB'); publicDB = getDB('publicDB'); const item = resultsDB[currentUser][idx]; resultsDB[currentUser].splice(idx, 1); setDB('resultsDB', resultsDB); if (publicDB[currentUser]) { publicDB[currentUser] = publicDB[currentUser].filter(p => p.url !== item.url); setDB('publicDB', publicDB); } renderGallery(); showToast('Deleted!'); }

        function openPreview(url) { document.getElementById('previewImage').src = url; document.getElementById('previewModal').classList.add('active'); }
        document.getElementById('previewModal').addEventListener('click', function() { this.classList.remove('active'); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { document.getElementById('previewModal').classList.remove('active'); document.getElementById('authModal').classList.remove('active'); } });
        async function downloadImage(url) { try { const r = await fetch(url); const b = await r.blob(); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `image_${Date.now()}.jpg`; a.click(); URL.revokeObjectURL(a.href); showToast('Downloading...'); } catch(e) { window.open(url, '_blank'); } }
        function copyText(t) { navigator.clipboard.writeText(t).then(() => showToast('Copied!')).catch(() => showToast('Copy failed')); }
        function showError(msg) { const el = document.getElementById('errorMessage'); el.textContent = msg; el.classList.add('active'); setTimeout(() => el.classList.remove('active'), 5000); }
        function showToast(msg, isError = false) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast' + (isError ? ' error' : ''); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    </script>
</body>
</html>
